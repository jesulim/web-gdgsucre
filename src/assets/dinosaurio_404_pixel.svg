<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1008" height="258" viewBox="0 0 168 43"
     role="img" aria-label="Dinosaurio pixelado mordiendo 404">
  <title>Dinosaurio pixelado mordiendo 404</title>
  <g fill="#535353" shape-rendering="crispEdges">
    <!-- Dinosaurio Chrome sin línea de suelo -->
    <path fill-rule="evenodd" d="M32 0h16v2h2v9H40v2h6v2h-8v4h4v4h-2v-2h-2v7h-2v3h-2v2h-2v8h2v2h-4v-6h-2v-2h-2v2h-2v2h-2v2h2v2h-4v-8h-2v-2h-2v-2h-2v-2h-2v-2h-2v-12h2v4h2v2h2v2h4v-2h2v-2h3v-2h3v-2h2V2h2zM34 3h2v2h-2z"/>

    <!-- Primer 4: con una mordida pixelada en el lado izquierdo -->
    <g transform="translate(46 1)">
      <!-- columna izquierda -->
      <rect x="0"  y="0"  width="6" height="6"/>
      <rect x="0"  y="6"  width="6" height="6"/>
      <!-- filas mordidas en y=12 y y=18: no se dibujan -->
      <rect x="0"  y="18" width="6" height="6"/>

      <!-- columna interior -->
      <rect x="6"  y="18" width="6" height="6"/>
      <rect x="12" y="18" width="6" height="6"/>
      <rect x="18" y="18" width="6" height="6"/>
      <rect x="24" y="18" width="6" height="6"/>
      <rect x="30" y="18" width="6" height="6"/>

      <!-- asta derecha -->
      <rect x="24" y="0"  width="6" height="6"/>
      <rect x="24" y="6"  width="6" height="6"/>
      <rect x="24" y="12" width="6" height="6"/>
      <rect x="24" y="24" width="6" height="6"/>
      <rect x="24" y="30" width="6" height="6"/>
      <rect x="24" y="36" width="6" height="6"/>
    </g>

    <!-- 0 -->
    <g transform="translate(84 1)">
      <rect x="6"  y="0"  width="24" height="6"/>
      <rect x="0"  y="6"  width="6"  height="30"/>
      <rect x="30" y="6"  width="6"  height="30"/>
      <rect x="6"  y="36" width="24" height="6"/>
    </g>

    <!-- Segundo 4 -->
    <g transform="translate(124 1)">
      <rect x="0"  y="0"  width="6" height="24"/>
      <rect x="6"  y="18" width="24" height="6"/>
      <rect x="24" y="0"  width="6" height="42"/>
    </g>
  </g>
</svg>
